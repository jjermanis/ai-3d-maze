<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Maze</title>
<style>
body {
    margin: 0;
    background: black;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}
#container {
    display: flex;
    gap: 16px;
}
canvas {
    border: 2px solid #444;
}
</style>
</head>
<body>

<div id="container">
    <canvas id="view3d" width="400" height="400"></canvas>
    <canvas id="view2d" width="400" height="400"></canvas>
</div>

<script>
const SIZE = 20;
const CELL = 20;
const FOV = Math.PI / 3;
const RAYS = 200;
const WALL_COLOR = { r: 180, g: 30, b: 30 };
const MAX_LIGHT_DIST = 12;

const maze = [];
for (let y = 0; y < SIZE; y++) {
    maze[y] = [];
    for (let x = 0; x < SIZE; x++) {
        maze[y][x] = { visited:false, walls:[1,1,1,1] };
    }
}

// fog of war
const seen = Array.from({ length: SIZE }, () =>
    Array(SIZE).fill(false)
);

// DFS maze generation
function dfs(x,y) {
    maze[y][x].visited = true;
    for (let d of [0,1,2,3].sort(()=>Math.random()-0.5)) {
        const nx = x + [0,1,0,-1][d];
        const ny = y + [-1,0,1,0][d];
        if (nx>=0 && ny>=0 && nx<SIZE && ny<SIZE && !maze[ny][nx].visited) {
            maze[y][x].walls[d] = 0;
            maze[ny][nx].walls[(d+2)%4] = 0;
            dfs(nx,ny);
        }
    }
}
dfs(0,0);

// Player — GRID LOCKED
const player = {
    x: 0,
    y: 0,
    dir: 1 // 0=UP,1=RIGHT,2=DOWN,3=LEFT
};

const ctx3 = view3d.getContext("2d");
const ctx2 = view2d.getContext("2d");

// Raycasting (read-only, no movement logic here)
function castRay(angle) {
    const sin = Math.sin(angle);
    const cos = Math.cos(angle);
    for (let t = 0; t < 20; t += 0.02) {
        const x = player.x + 0.5 + cos * t;
        const y = player.y + 0.5 + sin * t;
        const cx = Math.floor(x);
        const cy = Math.floor(y);

    // First: check bounds
    if (cx < 0 || cy < 0 || cx >= SIZE || cy >= SIZE) {
        return t;
    }

    // Second: check if the ray is blocked HERE
    if (
        maze[cy][cx].walls[0] && y < cy + 0.01 ||
        maze[cy][cx].walls[2] && y > cy + 0.99 ||
        maze[cy][cx].walls[3] && x < cx + 0.01 ||
        maze[cy][cx].walls[1] && x > cx + 0.99
    ) {
        return t; // DO NOT mark this cell as seen    
    }

    // Third: now we know the cell is truly visible
    seen[cy][cx] = true;    
    }
    return 20;
}

function draw3D() {
    ctx3.fillStyle = "#4fc3f7"; // sky
    ctx3.fillRect(0, 0, 400, 200);

    ctx3.fillStyle = "#2e7d32"; // floor
    ctx3.fillRect(0, 200, 400, 200);

    const baseAngle = player.dir * Math.PI / 2 - Math.PI / 2;

    for (let i = 0; i < RAYS; i++) {
        const angle = baseAngle + (i / RAYS - 0.5) * FOV;

        const d = castRay(angle);

        // Prevent divide-by-zero
        const dist = Math.max(d, 0.0001);

        // Wall height
        const h = 300 / dist;

        // ===== LIGHTING =====

        // Distance-based lighting (clamped)
        const light =
            Math.max(
                0,
                1 - dist / MAX_LIGHT_DIST
            );

        let r = WALL_COLOR.r * light;
        let g = WALL_COLOR.g * light;
        let b = WALL_COLOR.b * light;

        ctx3.fillStyle = `rgb(${r|0},${g|0},${b|0})`;

        ctx3.fillRect(
            i * 2,
            200 - h / 2,
            2,
            h
        );
    }
}

function draw2D() {
    ctx2.fillStyle = "#2e7d32";
    ctx2.fillRect(0,0,400,400);

    ctx2.strokeStyle = "#b71c1c";
    ctx2.lineWidth = 2;

    for (let y=0;y<SIZE;y++) for (let x=0;x<SIZE;x++) {
        const px=x*CELL, py=y*CELL;
        const w=maze[y][x].walls;
        if (!seen[y][x]) {
            ctx2.fillStyle = "#555";
            ctx2.fillRect(px, py, CELL, CELL);
            continue;
        }
        if (w[0]) { ctx2.beginPath(); ctx2.moveTo(px,py); ctx2.lineTo(px+CELL,py); ctx2.stroke(); }
        if (w[1]) { ctx2.beginPath(); ctx2.moveTo(px+CELL,py); ctx2.lineTo(px+CELL,py+CELL); ctx2.stroke(); }
        if (w[2]) { ctx2.beginPath(); ctx2.moveTo(px,py+CELL); ctx2.lineTo(px+CELL,py+CELL); ctx2.stroke(); }
        if (w[3]) { ctx2.beginPath(); ctx2.moveTo(px,py); ctx2.lineTo(px,py+CELL); ctx2.stroke(); }
    }

    // Arrow
    ctx2.save();
    ctx2.translate(player.x*CELL+CELL/2, player.y*CELL+CELL/2);
    ctx2.rotate(player.dir * Math.PI / 2 - Math.PI / 2);
    ctx2.fillStyle = "#aaa";
    ctx2.beginPath();
    ctx2.moveTo(8,0);
    ctx2.lineTo(-6,6);
    ctx2.lineTo(-6,-6);
    ctx2.fill();
    ctx2.restore();
}

document.addEventListener("keydown", e => {
    if (e.key==="ArrowLeft") player.dir = (player.dir+3)%4;
    if (e.key==="ArrowRight") player.dir = (player.dir+1)%4;
    if (e.key==="ArrowUp") {
        const dx=[0,1,0,-1][player.dir];
        const dy=[-1,0,1,0][player.dir];
        if (!maze[player.y][player.x].walls[player.dir]) {
            player.x += dx;
            player.y += dy;
        }
    }
});

function loop() {
    draw3D();
    draw2D();
    requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
